name: Break Glass

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for emergency activation
        required: true
        type: string
      change_reference:
        description: Incident or emergency change reference
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: break-glass
  cancel-in-progress: false

jobs:
  register:
    name: Register emergency request
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.audit.outputs.issue_number }}
    steps:
      - name: Create audit issue
        id: audit
        uses: actions/github-script@v8
        env:
          BREAK_GLASS_REASON: ${{ inputs.reason }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
        with:
          script: |
            const labels = [
              { name: 'critical', color: 'b60205' },
              { name: 'security', color: 'd73a4a' },
              { name: 'break-glass', color: '5319e7' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }

            const issue = await github.rest.issues.create({
              ...context.repo,
              title: `[BREAK-GLASS] ${process.env.CHANGE_REFERENCE}`,
              body: [
                '## Emergency access request',
                '',
                `- **Requester:** @${context.actor}`,
                `- **Reference:** ${process.env.CHANGE_REFERENCE}`,
                `- **Reason:** ${process.env.BREAK_GLASS_REASON}`,
                `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Execution remains blocked until the two approval stages are completed.'
              ].join('\n'),
              labels: labels.map(label => label.name)
            });

            core.setOutput('issue_number', issue.data.number);

  approval_one:
    name: Security approval
    needs: register
    runs-on: ubuntu-latest
    environment: break-glass-security-approval
    steps:
      - name: Record first approval
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number('${{ needs.register.outputs.issue_number }}'),
              body: [
                'First approval completed through the protected security environment.',
                '',
                `Reviewer identity is recorded in the deployment protection log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n')
            });

  approval_two:
    name: Operations approval
    needs:
      - register
      - approval_one
    runs-on: ubuntu-latest
    environment: break-glass-operations-approval
    steps:
      - name: Record second approval
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number('${{ needs.register.outputs.issue_number }}'),
              body: [
                'Second approval completed through the protected operations environment.',
                '',
                `Reviewer identity is recorded in the deployment protection log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n')
            });

  activate:
    name: Authorize emergency procedure
    needs:
      - register
      - approval_one
      - approval_two
    runs-on: ubuntu-latest
    steps:
      - name: Record authorization
        uses: actions/github-script@v8
        env:
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number('${{ needs.register.outputs.issue_number }}'),
              body: [
                '## Break-glass procedure authorized',
                '',
                `Reference **${process.env.CHANGE_REFERENCE}** passed both protected approval stages.`,
                `Authorization run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n')
            });
