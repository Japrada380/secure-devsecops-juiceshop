name: Break Glass

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for emergency activation"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  break-glass:
    name: Emergency Approval Workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Register Break Glass Activation
        run: |
          echo "=========================================="
          echo "BREAK GLASS ACTIVATED"
          echo "Repository : ${{ github.repository }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Reason     : ${{ inputs.reason }}"
          echo "Run ID     : ${{ github.run_id }}"
          echo "Date (UTC) : $(date -u)"
          echo "=========================================="

      - name: Create Critical Security Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[BREAK-GLASS] Emergency Change Approval Required",
              body: `
## Break Glass Activation

**Actor:** ${context.actor}

**Reason:**
${{ toJSON(inputs.reason) }}

**Workflow Run:** ${context.runId}

**Repository:** ${context.repo.owner}/${context.repo.repo}

> This issue was automatically generated by the Break Glass workflow for audit purposes.
              `,
              labels: ["critical","security","break-glass"]
            })

      - name: Finish
        run: echo "Break Glass workflow completed successfully."