name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  project-information:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --config auto --config .github/semgrep-rules .

      - name: Project Information
        run: |
          echo "====================================="
          echo " Secure DevSecOps Pipeline"
          echo "====================================="
          echo "Repository:"
          pwd
          ls -la
