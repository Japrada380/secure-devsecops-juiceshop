title: AWS IAM Privilege Escalation via AdministratorAccess
id: sigma-001
status: stable

description: Detecta la asignación de la política AdministratorAccess a un usuario IAM.

author: Simon Movilidad Technical Assessment

logsource:
  product: aws
  service: cloudtrail

detection:
  selection:
    eventName: AttachUserPolicy
    requestParameters.policyArn: arn:aws:iam::aws:policy/AdministratorAccess

  condition: selection

falsepositives:
  - Cambios de emergencia aprobados
  - Mantenimiento autorizado

level: critical

tags:
  - attack.privilege_escalation
  - attack.t1078
  - attack.t1098

